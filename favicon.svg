<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background shield gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fa8c38"/>
      <stop offset="60%" stop-color="#ea6d1d"/>
      <stop offset="100%" stop-color="#bd4006"/>
    </linearGradient>

    <!-- Golden border gradient -->
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1c7"/>
      <stop offset="35%" stop-color="#f5ba67"/>
      <stop offset="75%" stop-color="#d6842e"/>
      <stop offset="100%" stop-color="#934612"/>
    </linearGradient>

    <!-- Header bar gold -->
    <linearGradient id="favHeader" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffeab4"/>
      <stop offset="50%" stop-color="#df9e4a"/>
      <stop offset="100%" stop-color="#8d4411"/>
    </linearGradient>

    <linearGradient id="favTextGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fff2cc"/>
      <stop offset="75%" stop-color="#fed57c"/>
      <stop offset="100%" stop-color="#e0902c"/>
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <g filter="url(#favShadow)">
    <!-- 1. SHIELD DARK BASE -->
    <path d="M 8,14 L 56,14 L 56,46 Q 56,53 49,56 L 47,54 Q 42,59 36,62 Q 32,63.5 28,62 Q 22,59 17,54 L 15,56 Q 8,53 8,46 Z"
          fill="#2a1408" />

    <!-- 2. SHIELD GOLD BORDER -->
    <path d="M 9,13 L 55,13 L 55,45 Q 55,52 48,55 L 46,53 Q 41,58 35,61 Q 32,62.5 29,61 Q 23,58 18,53 L 16,55 Q 9,52 9,45 Z"
          fill="url(#favGold)" />

    <!-- 3. INNER STEP BEVEL -->
    <path d="M 12.5,15.5 L 51.5,15.5 L 51.5,43.5 Q 51.5,49.5 45.5,52 L 44.5,50.5 Q 40,55 34.5,57.5 Q 32,58.5 29.5,57.5 Q 24,55 19.5,50.5 L 18.5,52 Q 12.5,49.5 12.5,43.5 Z"
          fill="#a85215" opacity="0.6" />

    <!-- 4. ORANGE FIELD -->
    <path d="M 13,16 L 51,16 L 51,43 Q 51,49 45,51.5 L 44,50 Q 39,54.5 34,57 Q 32,58 30,57 Q 25,54.5 20,50 L 19,51.5 Q 13,49 13,43 Z"
          fill="url(#favBg)" />

    <!-- 5. THREE CURVED CLAW SLASH MARKS -->
    <!-- Left claw -->
    <path d="M 17,45
             C 18.5,39 22.5,32 27.5,24.5
             C 27.5,27.5 26,30.5 24.5,33.5
             L 27,35
             L 23,38
             C 21.5,41 19.5,43 17,45
             Z"
          fill="#ffffff" />
    <!-- Middle claw (Longest) -->
    <path d="M 23,48
             C 25.5,41 31.5,31 38,21
             C 37.5,26 35.5,31.5 33,35.5
             L 36,37.5
             L 31.5,41.5
             C 28.5,44.5 26,46.5 23,48
             Z"
          fill="#ffffff" />
    <!-- Right claw -->
    <path d="M 31,46
             C 34,39.5 40.5,31 46.5,22.5
             C 45.5,27.5 43,32.5 40.5,36.5
             L 43,38.5
             L 38.5,42
             C 36,44 33.5,45.2 31,46
             Z"
          fill="#ffffff" />

    <!-- 6. TOP HEADER PLAQUE WITH "PRO" -->
    <!-- Plaque dark shadow base -->
    <path d="M 4,9 C 4,4 9,1 15,1 L 49,1 C 55,1 60,4 60,9 C 60,12.5 56,15 53,16 L 11,16 C 8,15 4,12.5 4,9 Z"
          fill="#201005" />
    <!-- Plaque gold rim -->
    <path d="M 5,8.5 C 5,4.5 9.5,1.5 15,1.5 L 49,1.5 C 54.5,1.5 59,4.5 59,8.5 C 59,11.5 55.5,14 52.5,15 L 11.5,15 C 8.5,14 5,11.5 5,8.5 Z"
          fill="url(#favHeader)" />
    <!-- Plaque dark metal inlay -->
    <rect x="10.5" y="2.2" width="43" height="11" rx="2" fill="#1b0f07" stroke="#48270b" stroke-width="0.8"/>

    <!-- Norse wing rivets -->
    <circle cx="8" cy="8.5" r="1.3" fill="#ffeab4" stroke="#482205" stroke-width="0.5"/>
    <circle cx="56" cy="8.5" r="1.3" fill="#ffeab4" stroke="#482205" stroke-width="0.5"/>

    <!-- 7. "PRO" VECTOR GLYPHS -->
    <!-- 'P' -->
    <path d="M 16,3.5 L 23.5,3.5 C 26.2,3.5 27.8,4.6 27.8,6.8 C 27.8,9 26.2,10.1 23.5,10.1 L 19.6,10.1 L 19.6,12 L 16,12 Z M 19.6,5.5 L 19.6,8.1 L 23,8.1 C 24,8.1 24.6,7.7 24.6,6.8 C 24.6,5.9 24,5.5 23,5.5 Z"
          fill="url(#favTextGold)" stroke="#231004" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- 'R' -->
    <path d="M 28.5,3.5 L 35.8,3.5 C 38.3,3.5 39.8,4.6 39.8,6.7 C 39.8,8 38.8,9 37.3,9.4 L 40.5,12 L 36.3,12 L 33.7,9.7 L 32.1,9.7 L 32.1,12 L 28.5,12 Z M 32.1,5.5 L 32.1,7.7 L 35.3,7.7 C 36.3,7.7 36.8,7.3 36.8,6.6 C 36.8,5.9 36.3,5.5 35.3,5.5 Z"
          fill="url(#favTextGold)" stroke="#231004" stroke-width="0.5" stroke-linejoin="round"/>

    <!-- 'O' -->
    <path d="M 46.5,3.4 C 49.8,3.4 52,5.2 52,7.75 C 52,10.3 49.8,12.1 46.5,12.1 C 43.2,12.1 41,10.3 41,7.75 C 41,5.2 43.2,3.4 46.5,3.4 Z M 46.5,5.6 C 44.8,5.6 43.9,6.5 43.9,7.75 C 43.9,9 44.8,9.9 46.5,9.9 C 48.2,9.9 49.1,9 49.1,7.75 C 49.1,6.5 48.2,5.6 46.5,5.6 Z"
          fill="url(#favTextGold)" stroke="#231004" stroke-width="0.5" stroke-linejoin="round"/>
  </g>
</svg>
