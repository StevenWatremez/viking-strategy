<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <!-- Background shield gradient -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fa8c38"/>
      <stop offset="35%" stop-color="#f07a27"/>
      <stop offset="75%" stop-color="#dd5c15"/>
      <stop offset="100%" stop-color="#bf4306"/>
    </linearGradient>

    <!-- Golden border gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0c4"/>
      <stop offset="25%" stop-color="#fcd289"/>
      <stop offset="55%" stop-color="#e99e4b"/>
      <stop offset="85%" stop-color="#cb792e"/>
      <stop offset="100%" stop-color="#934612"/>
    </linearGradient>

    <!-- Gold highlight on top edge -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbd68c" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Dark bronze base rim -->
    <linearGradient id="bronzeDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4d2c19"/>
      <stop offset="100%" stop-color="#241006"/>
    </linearGradient>

    <!-- Header bar gold -->
    <linearGradient id="headerGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe8b0"/>
      <stop offset="50%" stop-color="#df9d48"/>
      <stop offset="100%" stop-color="#974e17"/>
    </linearGradient>

    <!-- Norse Chiseled Text Gold -->
    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff5d4"/>
      <stop offset="45%" stop-color="#fed67e"/>
      <stop offset="85%" stop-color="#e59835"/>
      <stop offset="100%" stop-color="#a65814"/>
    </linearGradient>

    <!-- Claw drop shadow -->
    <filter id="clawShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="-1.5" dy="2" stdDeviation="1.5" flood-color="#541b02" flood-opacity="0.75"/>
    </filter>

    <!-- Shield outer shadow -->
    <filter id="shieldShadow" x="-15%" y="-10%" width="130%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#shieldShadow)">
    <!-- 1. SHIELD DROP RIM (Dark bevel underneath) -->
    <path d="M 22,48
             L 178,48
             L 178,168
             C 178,186 166,198 152,204
             L 146,198
             C 134,212 118,226 100,230
             C 82,226 66,212 54,198
             L 48,204
             C 34,198 22,186 22,168
             Z"
          fill="url(#bronzeDark)" />

    <!-- 2. SHIELD GOLDEN BORDER -->
    <path d="M 24,46
             L 176,46
             L 176,166
             C 176,183 164,194 151,200
             L 145,195
             C 133,208 117,222 100,226
             C 83,222 67,208 55,195
             L 49,200
             C 36,194 24,183 24,166
             Z"
          fill="url(#goldBorder)" />

    <!-- 3. INNER BEVEL CUT (Golden step line) -->
    <path d="M 37,56
             L 163,56
             L 163,158
             C 163,172 153,181 142,186
             L 137,182
             C 127,194 114,206 100,210
             C 86,206 73,194 63,182
             L 58,186
             C 47,181 37,172 37,158
             Z"
          fill="#c06a1d" opacity="0.65" />

    <!-- 4. SHIELD INNER ORANGE FIELD -->
    <path d="M 39,58
             L 161,58
             L 161,156
             C 161,170 151,179 141,184
             L 136,180
             C 126,191 113,203 100,207
             C 87,203 74,191 64,180
             L 59,184
             C 49,179 39,170 39,156
             Z"
          fill="url(#shieldBg)" />

    <!-- 5. LIGHT HIGHLIGHT ON TOP-LEFT OF SHIELD -->
    <path d="M 24,46 L 65,46 L 40,165 L 24,165 Z"
          fill="url(#goldHighlight)" opacity="0.35" />

    <!-- 6. THE THREE FIERCE CLAW SLASH MARKS -->
    <!-- Left Claw Slash -->
    <path d="M 52,154
             C 54,142 62,124 71,108
             C 77,98 83,88 90,78
             C 88,88 85,97 81,106
             L 86,112
             L 77,122
             C 70,133 62,145 52,154
             Z"
          fill="#ffffff" filter="url(#clawShadow)" />
    <!-- Claw 1 Facet Shadow -->
    <path d="M 52,154 C 54,142 62,124 71,108 L 77,122 C 70,133 62,145 52,154 Z"
          fill="#ebe3d7" opacity="0.5" />

    <!-- Center Claw Slash (Longest & Deepest) -->
    <path d="M 70,168
             C 76,150 86,128 98,106
             C 107,90 118,74 128,58
             C 123,73 118,88 111,101
             L 118,107
             L 106,120
             C 96,137 84,153 70,168
             Z"
          fill="#ffffff" filter="url(#clawShadow)" />
    <!-- Claw 2 Facet Shadow -->
    <path d="M 70,168 C 76,150 86,128 98,106 L 106,120 C 96,137 84,153 70,168 Z"
          fill="#ebe3d7" opacity="0.5" />

    <!-- Right Claw Slash -->
    <path d="M 96,156
             C 105,140 117,120 128,103
             C 137,90 148,77 156,66
             C 151,80 145,93 137,106
             L 143,112
             L 132,122
             C 122,135 111,146 96,156
             Z"
          fill="#ffffff" filter="url(#clawShadow)" />
    <!-- Claw 3 Facet Shadow -->
    <path d="M 96,156 C 105,140 117,120 128,103 L 132,122 C 122,135 111,146 96,156 Z"
          fill="#ebe3d7" opacity="0.5" />

    <!-- 7. TOP VIKING HEADER PLAQUE FOR "PRO" -->
    <!-- Plaque Outer Dark Shadow Base -->
    <path d="M 12,34
             C 12,18 24,10 40,10
             L 160,10
             C 176,10 188,18 188,34
             C 188,43 182,49 172,52
             L 165,46
             L 35,46
             L 28,52
             C 18,49 12,43 12,34
             Z"
          fill="url(#bronzeDark)" />

    <!-- Plaque Golden Beveled Arch -->
    <path d="M 14,32
             C 14,19 25,12 39,12
             L 161,12
             C 175,12 186,19 186,32
             C 186,40 181,46 171,48
             L 164,43
             L 36,43
             L 29,48
             C 19,46 14,40 14,32
             Z"
          fill="url(#headerGold)" />

    <!-- Plaque Inset Dark Metal Field -->
    <path d="M 33,16
             L 167,16
             C 172,16 176,20 176,26
             C 176,33 172,39 166,39
             L 34,39
             C 28,39 24,33 24,26
             C 24,20 28,16 33,16
             Z"
          fill="#23170e" stroke="#633917" stroke-width="1.5" />

    <!-- Norse Knot / Wing accents on sides of plaque -->
    <!-- Left knot -->
    <path d="M 22,23 L 28,29 L 22,35 L 18,29 Z" fill="none" stroke="#fed887" stroke-width="1.5"/>
    <circle cx="28" cy="22" r="1.8" fill="#ffe9af" stroke="#5a2f0c" stroke-width="0.8"/>
    <!-- Right knot -->
    <path d="M 178,23 L 172,29 L 178,35 L 182,29 Z" fill="none" stroke="#fed887" stroke-width="1.5"/>
    <circle cx="172" cy="22" r="1.8" fill="#ffe9af" stroke="#5a2f0c" stroke-width="0.8"/>

    <!-- 8. CHISELED NORSE "PRO" VECTOR GLYPHS -->
    <g filter="url(#clawShadow)">
      <!-- LETTER 'P' -->
      <!-- Outer P -->
      <path d="M 64,19
               L 82,19
               C 89,19 93,22 93,27
               C 93,32 89,35 82,35
               L 73,35
               L 73,43
               L 64,43
               Z
               M 73,24.5
               L 81,24.5
               C 84,24.5 85.5,25.5 85.5,27
               C 85.5,28.5 84,29.5 81,29.5
               L 73,29.5
               Z"
            fill="url(#textGold)" stroke="#271305" stroke-width="1" stroke-linejoin="round"/>
      <!-- P Chisel Highlight -->
      <path d="M 64,19 L 82,19 C 89,19 93,22 93,27 L 85.5,27 C 85.5,25.5 84,24.5 81,24.5 L 73,24.5 L 73,43 L 68.5,43 L 68.5,24.5 L 64,24.5 Z"
            fill="#ffffff" opacity="0.3"/>

      <!-- LETTER 'R' -->
      <!-- Outer R -->
      <path d="M 98,19
               L 116,19
               C 123,19 127,22 127,27
               C 127,30.5 124.5,32.8 120.5,33.8
               L 128,43
               L 118,43
               L 111.5,35
               L 107,35
               L 107,43
               L 98,43
               Z
               M 107,24.5
               L 115,24.5
               C 118,24.5 119.5,25.5 119.5,27
               C 119.5,28.5 118,29.5 115,29.5
               L 107,29.5
               Z"
            fill="url(#textGold)" stroke="#271305" stroke-width="1" stroke-linejoin="round"/>
      <!-- R Chisel Highlight -->
      <path d="M 98,19 L 116,19 C 123,19 127,22 127,27 L 119.5,27 C 119.5,25.5 118,24.5 115,24.5 L 107,24.5 L 107,43 L 102.5,43 L 102.5,24.5 L 98,24.5 Z"
            fill="#ffffff" opacity="0.3"/>

      <!-- LETTER 'O' (Runic Diamond Cut) -->
      <path d="M 146,19
               L 158,29
               L 146,43
               L 134,29
               Z
               M 146,24.5
               L 151.5,29
               L 146,37.5
               L 140.5,29
               Z"
            fill="url(#textGold)" stroke="#271305" stroke-width="1" stroke-linejoin="round"/>
      <!-- O Chisel Highlight -->
      <path d="M 146,19 L 158,29 L 151.5,29 L 146,24.5 L 140.5,29 L 134,29 Z"
            fill="#ffffff" opacity="0.3"/>
    </g>
  </g>
</svg>
